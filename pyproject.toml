[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gearshift"
dynamic = ["version"]
description = 'Encryption at Rest tools'
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = []
authors = [
  { name = "David", email = "david@lenderkeycanada.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "click>=8", 
    "PyYAML>=6.0", 
    "hvac>=1.2", 
    "cryptography>=41.0", 
]

[project.urls]
Documentation = "https://github.com/lenderkey/gearshift#readme"
Issues = "https://github.com/lenderkey/gearshift/issues"
Source = "https://github.com/lenderkey/gearshift"

[tool.hatch.version]
path = "src/gearshift/__about__.py"

[dependency-groups]
dev = [
  "coverage[toml]>=6.5",
  "pytest",
  "black>=24.10.0",
  "mypy>=1.0.0",
  "ruff>=0.7.0",
]

[tool.black]
target-version = ["py313"]
line-length = 120
skip-string-normalization = true

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  # Ignore checks for possible passwords
  "S105", "S106", "S107",
  # Ignore complexity
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
]
unfixable = [
  # Don't touch unused imports
  "F401",
]

[tool.ruff.lint.isort]
known-first-party = ["gearshift"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.coverage.run]
source_pkgs = ["gearshift"]
branch = true
parallel = true
omit = [
  "src/gearshift/__about__.py",
]

[tool.coverage.paths]
gearshift = ["src/gearshift", "*/gearshift/src/gearshift"]

[tool.coverage.report]
fail_under = 99
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
